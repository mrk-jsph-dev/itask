# Optional: SQL Server locally for parity with Azure SQL.
# Day-to-day development uses SQLite and needs none of this.
#
#   cp .env.example .env    # set SQL_SA_PASSWORD (gitignored)
#   docker compose up -d sql
#
# Then run the API with:
#   Database__Provider=SqlServer
#   ConnectionStrings__Default="Server=localhost,1433;Database=itask;User Id=sa;Password=<SQL_SA_PASSWORD>;TrustServerCertificate=True"
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - itask-sql:/var/opt/mssql

volumes:
  itask-sql:
