<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 800" width="1380" height="800" role="img" aria-label="iTask architecture" font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#C9D3E3"/></pattern>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity=".08"/></filter>
<marker id="a-visitor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D5BF5"/></marker>
<marker id="a-host" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5E9"/></marker>
<marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D5BF5"/></marker>
<marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="a-files" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891B2"/></marker>
<marker id="a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/></marker>
<marker id="a-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="a-deploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA8A04"/></marker>
<marker id="a-guard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<style>.edge{fill:none;stroke-width:2.5}.flow{fill:none;stroke-width:2.5;stroke-dasharray:6 10;animation:march 1.2s linear infinite;opacity:.9}@keyframes march{to{stroke-dashoffset:-32}}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style>
<rect width="1380" height="800" rx="18" fill="#E9EEF6"/><rect width="1380" height="800" rx="18" fill="url(#dots)"/>
<text x="40" y="44" class="mono" font-size="20" fill="#475569">How a request moves through iTask</text>
<g id="e1"><path class="edge" d="M310,300 L415,300 L415,122 L520,122" stroke="#1D5BF5" stroke-opacity=".45" marker-end="url(#a-visitor)"/>
<path class="flow" d="M310,300 L415,300 L415,122 L520,122" stroke="#1D5BF5"/>
<circle r="5" fill="#1D5BF5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M310,300 L415,300 L415,122 L520,122"/></circle>
<rect x="343.5" y="185" width="143" height="30" rx="15" fill="#FFFFFF" stroke="#1D5BF5" stroke-width="1.5"/>
<text x="415" y="205" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">loads the app</text></g>
<g id="e2"><path class="edge" d="M310,345 L415,345 L415,371 L520,371" stroke="#1D5BF5" stroke-opacity=".45" marker-end="url(#a-visitor)"/>
<path class="flow" d="M310,345 L415,345 L415,371 L520,371" stroke="#1D5BF5"/>
<circle r="5" fill="#1D5BF5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M310,345 L415,345 L415,371 L520,371"/></circle>
<rect x="339.0" y="395" width="152" height="30" rx="15" fill="#FFFFFF" stroke="#1D5BF5" stroke-width="1.5"/>
<text x="415" y="415" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">JSON + SignalR</text></g>
<g id="e3"><path class="edge" d="M840,330 L930,330 L930,92 L1060,92" stroke="#7C3AED" stroke-opacity=".45" marker-end="url(#a-data)"/>
<path class="flow" d="M840,330 L930,330 L930,92 L1060,92" stroke="#7C3AED"/>
<circle r="5" fill="#7C3AED"><animateMotion dur="2.4s" repeatCount="indefinite" path="M840,330 L930,330 L930,92 L1060,92"/></circle>
<rect x="885.5" y="145" width="89" height="30" rx="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="930" y="165" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">EF Core</text></g>
<g id="e4"><path class="edge" d="M840,352 L995,352 L995,236 L1060,236" stroke="#0891B2" stroke-opacity=".45" marker-end="url(#a-files)"/>
<path class="flow" d="M840,352 L995,352 L995,236 L1060,236" stroke="#0891B2"/>
<circle r="5" fill="#0891B2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M840,352 L995,352 L995,236 L1060,236"/></circle>
<rect x="959.5" y="285" width="71" height="30" rx="15" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
<text x="995" y="305" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">files</text></g>
<g id="e5"><path class="edge" d="M840,380 L1060,380" stroke="#DB2777" stroke-opacity=".45" marker-end="url(#a-ai)"/>
<path class="flow" d="M840,380 L1060,380" stroke="#DB2777"/>
<circle r="5" fill="#DB2777"><animateMotion dur="2.4s" repeatCount="indefinite" path="M840,380 L1060,380"/></circle>
<rect x="860.5" y="365" width="179" height="30" rx="15" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5"/>
<text x="950" y="385" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">✨ only when asked</text></g>
<g id="e6"><path class="edge" d="M840,410 L970,410 L970,524 L1060,524" stroke="#64748B" stroke-opacity=".45" marker-end="url(#a-obs)"/>
<path class="flow" d="M840,410 L970,410 L970,524 L1060,524" stroke="#64748B"/>
<circle r="5" fill="#64748B"><animateMotion dur="2.4s" repeatCount="indefinite" path="M840,410 L970,410 L970,524 L1060,524"/></circle>
<rect x="939.0" y="455" width="62" height="30" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="970" y="475" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">logs</text></g>
<g id="e7"><path class="edge" d="M310,672 L520,672" stroke="#CA8A04" stroke-opacity=".45" marker-end="url(#a-deploy)"/>
<path class="flow" d="M310,672 L520,672" stroke="#CA8A04"/>
<circle r="5" fill="#CA8A04"><animateMotion dur="2.4s" repeatCount="indefinite" path="M310,672 L520,672"/></circle>
<rect x="357.0" y="657" width="116" height="30" rx="15" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5"/>
<text x="415" y="677" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">push image</text></g>
<g id="e8"><path class="edge" d="M680,620 L680,446" stroke="#CA8A04" stroke-opacity=".45" marker-end="url(#a-deploy)"/>
<path class="flow" d="M680,620 L680,446" stroke="#CA8A04"/>
<circle r="5" fill="#CA8A04"><animateMotion dur="2.4s" repeatCount="indefinite" path="M680,620 L680,446"/></circle>
<rect x="622.0" y="545" width="116" height="30" rx="15" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5"/>
<text x="680" y="565" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">pull image</text></g>
<g id="e9"><path class="edge" d="M1060,692 L900,692 L900,430 L840,430" stroke="#DC2626" stroke-opacity=".45" marker-end="url(#a-guard)"/>
<path class="flow" d="M1060,692 L900,692 L900,430 L840,430" stroke="#DC2626"/>
<circle r="5" fill="#DC2626"><animateMotion dur="2.4s" repeatCount="indefinite" path="M1060,692 L900,692 L900,430 L840,430"/></circle>
<rect x="828.5" y="585" width="143" height="30" rx="15" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="900" y="605" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">stops at 100%</text></g>
<g id="browser" filter="url(#sh)"><rect x="40" y="270" width="270" height="104" rx="14" fill="#FFFFFF" stroke="#1D5BF5" stroke-width="2"/>
<circle cx="65" cy="297" r="5" fill="#1D5BF5"/>
<text x="79" y="302" class="mono" font-size="14" letter-spacing="1" fill="#1D5BF5">VISITOR</text>
<text x="60" y="332" font-size="22" font-weight="600" fill="#0F172A">Browser</text>
<text x="60" y="356" font-size="15" fill="#475569">installable PWA, any screen</text></g>
<g id="swa" filter="url(#sh)"><rect x="520" y="70" width="320" height="104" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
<circle cx="545" cy="97" r="5" fill="#0EA5E9"/>
<text x="559" y="102" class="mono" font-size="14" letter-spacing="1" fill="#0EA5E9">HOST</text>
<text x="540" y="132" font-size="22" font-weight="600" fill="#0F172A">Static Web Apps</text>
<text x="540" y="156" font-size="15" fill="#475569">Vue 3 + TypeScript, Free plan</text></g>
<g id="api" filter="url(#sh)"><rect x="520" y="296" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#1D5BF5" stroke-width="2"/>
<circle cx="545" cy="323" r="5" fill="#1D5BF5"/>
<text x="559" y="328" class="mono" font-size="14" letter-spacing="1" fill="#1D5BF5">API</text>
<text x="540" y="358" font-size="22" font-weight="600" fill="#0F172A">Container Apps</text>
<text x="540" y="382" font-size="15" fill="#475569">ASP.NET Core 10 minimal API</text></g>
<g id="sql" filter="url(#sh)"><rect x="1060" y="40" width="290" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="1085" cy="67" r="5" fill="#7C3AED"/>
<text x="1099" y="72" class="mono" font-size="14" letter-spacing="1" fill="#7C3AED">DATA</text>
<text x="1080" y="102" font-size="22" font-weight="600" fill="#0F172A">Azure SQL Database</text>
<text x="1080" y="126" font-size="15" fill="#475569">free offer, auto-pause</text></g>
<g id="blob" filter="url(#sh)"><rect x="1060" y="184" width="290" height="104" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<circle cx="1085" cy="211" r="5" fill="#0891B2"/>
<text x="1099" y="216" class="mono" font-size="14" letter-spacing="1" fill="#0891B2">FILES</text>
<text x="1080" y="246" font-size="22" font-weight="600" fill="#0F172A">Blob Storage</text>
<text x="1080" y="270" font-size="15" fill="#475569">card attachments, short SAS links</text></g>
<g id="ai" filter="url(#sh)"><rect x="1060" y="328" width="290" height="104" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<circle cx="1085" cy="355" r="5" fill="#DB2777"/>
<text x="1099" y="360" class="mono" font-size="14" letter-spacing="1" fill="#DB2777">AI</text>
<text x="1080" y="390" font-size="22" font-weight="600" fill="#0F172A">Azure AI Foundry</text>
<text x="1080" y="414" font-size="15" fill="#475569">OpenAI deployment, daily caps</text></g>
<g id="obs" filter="url(#sh)"><rect x="1060" y="472" width="290" height="104" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<circle cx="1085" cy="499" r="5" fill="#64748B"/>
<text x="1099" y="504" class="mono" font-size="14" letter-spacing="1" fill="#64748B">OBSERVE</text>
<text x="1080" y="534" font-size="22" font-weight="600" fill="#0F172A">Log Analytics</text>
<text x="1080" y="558" font-size="15" fill="#475569">App Insights, daily ingest cap</text></g>
<g id="gha" filter="url(#sh)"><rect x="40" y="620" width="270" height="104" rx="14" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2"/>
<circle cx="65" cy="647" r="5" fill="#CA8A04"/>
<text x="79" y="652" class="mono" font-size="14" letter-spacing="1" fill="#CA8A04">DEPLOY</text>
<text x="60" y="682" font-size="22" font-weight="600" fill="#0F172A">GitHub Actions</text>
<text x="60" y="706" font-size="15" fill="#475569">tests, Bicep, OIDC, approval</text></g>
<g id="ghcr" filter="url(#sh)"><rect x="520" y="620" width="320" height="104" rx="14" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2"/>
<circle cx="545" cy="647" r="5" fill="#CA8A04"/>
<text x="559" y="652" class="mono" font-size="14" letter-spacing="1" fill="#CA8A04">IMAGE</text>
<text x="540" y="682" font-size="22" font-weight="600" fill="#0F172A">Container Registry</text>
<text x="540" y="706" font-size="15" fill="#475569">public API image on GHCR</text></g>
<g id="guard" filter="url(#sh)"><rect x="1060" y="640" width="290" height="104" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
<circle cx="1085" cy="667" r="5" fill="#DC2626"/>
<text x="1099" y="672" class="mono" font-size="14" letter-spacing="1" fill="#DC2626">COST GUARD</text>
<text x="1080" y="702" font-size="22" font-weight="600" fill="#0F172A">Budget + kill switch</text>
<text x="1080" y="726" font-size="15" fill="#475569">$2 a month, stops the API</text></g>
<rect x="540" y="400" width="104" height="28" rx="14" fill="#EEF3FF"/>
<text x="592.0" y="419" text-anchor="middle" font-size="12.5" fill="#1D4ED8">⚡ automations</text>
<rect x="650" y="400" width="98" height="28" rx="14" fill="#EEF3FF"/>
<text x="699.0" y="419" text-anchor="middle" font-size="12.5" fill="#1D4ED8">✨ AI gateway</text>
<rect x="754" y="400" width="70" height="28" rx="14" fill="#EEF3FF"/>
<text x="789.0" y="419" text-anchor="middle" font-size="12.5" fill="#1D4ED8">⏰ timers</text>
<text x="40" y="776" font-size="15" fill="#475569">Dashed lines show the direction of each call. Everything is deployed with Bicep; the API reaches Azure services with its managed identity.</text>
</svg>