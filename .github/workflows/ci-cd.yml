# Manual only: "Run workflow" (workflow_dispatch) runs CI, then deploys when run from main.
# The deploy job uses the "production" environment (required reviewers, main only) and
# signs in to Azure via OIDC (azure/login). After a successful deploy, the release job tags
# the commit vX.Y.Z (version from backend/Directory.Build.props) and publishes a GitHub
# release with that version's CHANGELOG.md section; it does nothing if the release exists.
#
# Unchanged parts are skipped by content, not by git diff: the API image is tagged with the
# git tree hash of backend/ (no build when that tag is already on GHCR), and the site holds
# build-id.txt, a hash of the frontend/ tree and its build settings (no build or upload when the
# live one matches). infra=app-only swaps the API image without Bicep: it does NOT copy changed
# GitHub secrets to the container app, so use full (the default) after changing secrets or infra/.
name: ci-cd

on:
  workflow_dispatch:
    inputs:
      infra:
        description: "full = Bicep (infra + secrets); app-only = new API image only, skips Bicep"
        type: choice
        options: [full, app-only]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    permissions:
      contents: read
      security-events: write

  deploy:
    name: Deploy to Azure
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.infra.outputs.siteUrl || steps.app.outputs.siteUrl }}
    permissions:
      contents: read
      packages: write # push the API image to GHCR
      id-token: write # OIDC token for Azure, only in this job
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/itask-api
      RESOURCE_GROUP: rg-itask
      API_APP: ca-itask-api
      INFRA_MODE: ${{ inputs.infra || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Content ids
        id: ids
        run: |
          echo "image=${REGISTRY_IMAGE}:$(git rev-parse HEAD:backend)" >> "$GITHUB_OUTPUT"
          echo "frontendTree=$(git rev-parse HEAD:frontend)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this API image already built?
        id: image
        env:
          IMAGE: ${{ steps.ids.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "backend/ unchanged: reusing $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.ids.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Azure sign-in (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          # production secrets, so the tenant and subscription ids stay out of public run logs
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        id: infra
        if: env.INFRA_MODE == 'full'
        env:
          ITASK_API_IMAGE: ${{ steps.ids.outputs.image }}
          # production environment secrets, stored as Container Apps secrets by the Bicep deploy
          ITASK_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          ITASK_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ITASK_PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }} # optional; a secret so the emails stay out of public logs
          ITASK_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }} # optional; Gmail address that sends email
          ITASK_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }} # optional; Gmail app password
          ITASK_GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }} # optional; "Continue with GitHub"
          ITASK_MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }} # optional; "Continue with Microsoft"
          ITASK_AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }} # optional; Foundry endpoint, AI is off when empty
          ITASK_AI_DEPLOYMENT: ${{ secrets.AI_DEPLOYMENT }} # optional; model deployment name in Foundry
          ITASK_SQL_ADMIN_GROUP_ID: ${{ secrets.SQL_ADMIN_GROUP_ID }} # optional; Entra group used as SQL admin
          ITASK_GITHUB_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }} # optional, not a secret
          ITASK_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }} # optional, not a secret
        run: |
          out=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "itask-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          {
            echo "apiUrl=$(jq -r .apiUrl.value <<<"$out")"
            echo "siteName=$(jq -r .siteName.value <<<"$out")"
            echo "siteUrl=$(jq -r .siteUrl.value <<<"$out")"
          } >> "$GITHUB_OUTPUT"

      - name: Update the API image only (app-only)
        id: app
        if: env.INFRA_MODE == 'app-only'
        env:
          IMAGE: ${{ steps.ids.outputs.image }}
        run: |
          current=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --only-show-errors \
            --query "properties.template.containers[0].image" -o tsv)
          if [ "$current" = "$IMAGE" ]; then
            echo "API already runs $IMAGE"
          else
            az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" --image "$IMAGE" --only-show-errors -o none
          fi
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --only-show-errors \
            --query properties.configuration.ingress.fqdn -o tsv)
          site=$(az staticwebapp list -g "$RESOURCE_GROUP" --only-show-errors --query "[0].name" -o tsv)
          host=$(az staticwebapp show -g "$RESOURCE_GROUP" -n "$site" --only-show-errors --query defaultHostname -o tsv)
          {
            echo "apiUrl=https://${fqdn}"
            echo "siteName=${site}"
            echo "siteUrl=https://${host}"
          } >> "$GITHUB_OUTPUT"

      - name: Is this site build already live?
        id: site
        env:
          API_URL: ${{ steps.infra.outputs.apiUrl || steps.app.outputs.apiUrl }}
          SITE_URL: ${{ steps.infra.outputs.siteUrl || steps.app.outputs.siteUrl }}
          FRONTEND_TREE: ${{ steps.ids.outputs.frontendTree }}
          SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          # Everything the build depends on: frontend/ content, the API URL and the Turnstile site key.
          id=$(printf '%s\n%s\n%s\n' "$FRONTEND_TREE" "$API_URL" "$SITE_KEY" | sha256sum | cut -c1-32)
          live=$(curl -fsS --max-time 20 "${SITE_URL}/build-id.txt?run=${GITHUB_RUN_ID}" 2>/dev/null || true)
          echo "buildId=$id" >> "$GITHUB_OUTPUT"
          if [ "$live" = "$id" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ and its settings unchanged: keeping the live site"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.site.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.site.outputs.deploy == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.infra.outputs.apiUrl || steps.app.outputs.apiUrl }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }} # public site key
          BUILD_ID: ${{ steps.site.outputs.buildId }}
        run: |
          npm ci
          npx vite build
          echo "$BUILD_ID" > dist/build-id.txt

      - name: Deploy frontend (token fetched now, never stored)
        if: steps.site.outputs.deploy == 'true'
        env:
          SITE_NAME: ${{ steps.infra.outputs.siteName || steps.app.outputs.siteName }}
        run: |
          token=$(az staticwebapp secrets list -n "$SITE_NAME" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          npx --yes @azure/static-web-apps-cli@2.1.0 deploy frontend/dist \
            --deployment-token "$token" --env production

  release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the version tag and release, only in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish release notes for this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' backend/Directory.Build.props)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          # The "## <version>" section of CHANGELOG.md, up to the next "## " heading.
          awk -v heading="## ${version}" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${version}' section."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "iTask ${tag}" \
            --notes-file notes.md --generate-notes --latest
