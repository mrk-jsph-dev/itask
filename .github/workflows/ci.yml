# Pull requests to main: CI only. No deploy job and no id-token permission.
name: ci

on:
  pull_request:
    branches: [main]
    # ready_for_review runs CI once a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Drafts can't merge, so CI waits until the PR is ready for review.
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/ci-reusable.yml
    permissions:
      contents: read
      security-events: write
    with:
      # Fork PRs get a read-only token, so they can't upload scan results.
      upload-codeql: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
